name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run TruffleHog
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
          head: ${{ github.sha }}
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SERVER_URL: https://github.com
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref }}
      
      - name: Report findings
        if: failure()
        run: |
          echo "::error::Secrets detected in the codebase!"
          echo "Please review the scan results above and remove any committed secrets."
          echo "If you need help with key rotation, see docs/API_KEY_MANAGEMENT.md"
          exit 1
      
      - name: Create security issue
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Secret Detected in Commit ${{ github.sha }}';
            const body = `
            ## Secret Detection Alert
            
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Author:** ${{ github.actor }}
            
            The automated secret scan detected potential secrets in the codebase.
            
            ### Immediate Actions Required:
            1. **DO NOT** merge this PR
            2. Remove any committed secrets immediately
            3. Rotate all exposed keys
            4. Review [API Key Management documentation](https://github.com/${{ github.repository }}/blob/main/docs/API_KEY_MANAGEMENT.md)
            
            ### Resources:
            - Security Team: security@kampusabla.com
            - Emergency: +90-555-XXX-XXXX
            
            ---
            *This issue was automatically created by the secret scanning workflow.*
            `;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'urgent', 'secret-leak']
            });
      
      - name: Notify team
        if: failure() && github.event_name == 'push'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            🚨 **SECRET DETECTED** in commit ${{ github.sha }}
            
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            
            Immediate action required! Check the security scan results.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_ALERTS_SLACK }}